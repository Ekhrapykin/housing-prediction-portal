[project]
name = "estimator-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
# slowapi 0.1.x calls asyncio.iscoroutinefunction, deprecated in Python 3.14; harmless until it updates.
filterwarnings = ["ignore::DeprecationWarning:slowapi.*"]
