# Local:  docker compose up --build
# Host:   docker compose pull && docker compose up -d --no-build
# Host ports come from .env (ML_API_PORT, ESTIMATOR_API_PORT, MARKET_API_PORT, WEB_PORT); defaults below.
x-common: &common
  restart: unless-stopped

# Shared healthcheck timings; each service adds its own `test` and overrides only what it needs.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 15s

services:
  postgres:
    <<: *common
    image: postgres:17-alpine
    # No published port: only the two backends reach it over the compose network.
    environment:
      POSTGRES_DB: housing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_demo}
      ESTIMATOR_DB_PASSWORD: ${ESTIMATOR_DB_PASSWORD:-estimator_demo}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:-market_demo}
    # Small-memory settings: the stack's limits are sized to fit a small 2-4 GB host.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      # -h 127.0.0.1: the temporary init-time server only listens on the unix socket, so this stays unhealthy until init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d housing"]

  ml-api:
    <<: *common
    build: ./ml-api
    image: ghcr.io/ekhrapykin/hpp-ml-api:${TAG:-latest}
    # Published so Swagger (/docs) can be shown live.
    ports: ["${ML_API_PORT:-8000}:${ML_API_PORT:-8000}"]
    environment:
      PORT: ${ML_API_PORT:-8000}
      DATA_PATH: /data/house_prices.csv
    volumes: ["./data/house_prices.csv:/data/house_prices.csv:ro"]
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${ML_API_PORT:-8000}/health')"]
      start_period: 30s # trains the model at startup

  estimator-api:
    <<: *common
    build: ./estimator-api
    image: ghcr.io/ekhrapykin/hpp-estimator-api:${TAG:-latest}
    # Published for Swagger demos; the portal reaches it over the compose network, so drop this in a locked-down setup.
    # The write rate limiter still applies on this port, keyed by the TCP peer, because only `web` is trusted for X-Forwarded-For.
    ports: ["${ESTIMATOR_API_PORT:-8001}:${ESTIMATOR_API_PORT:-8001}"]
    environment:
      PORT: ${ESTIMATOR_API_PORT:-8001}
      ML_API_URL: http://ml-api:${ML_API_PORT:-8000}
      TRUSTED_PROXIES: web # same as the default; whose X-Forwarded-For the rate limiter believes
      DATABASE_URL: postgresql+psycopg://estimator:${ESTIMATOR_DB_PASSWORD:-estimator_demo}@postgres:5432/housing
    mem_limit: 256m
    depends_on:
      ml-api: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${ESTIMATOR_API_PORT:-8001}/health')"]

  market-api:
    <<: *common
    build: ./market-api
    image: ghcr.io/ekhrapykin/hpp-market-api:${TAG:-latest}
    # Published for Swagger demos (/swagger-ui.html); the portal uses the compose network.
    ports: ["${MARKET_API_PORT:-8080}:${MARKET_API_PORT:-8080}"]
    environment:
      PORT: ${MARKET_API_PORT:-8080}
      ML_API_URL: http://ml-api:${ML_API_PORT:-8000}
      SPRING_PROFILES_ACTIVE: docker
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:-market_demo}
      DATA_PATH: /data/house_prices.csv
    volumes: ["./data/house_prices.csv:/data/house_prices.csv:ro"]
    mem_limit: 640m
    depends_on:
      ml-api: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      # temurin JRE images ship curl.
      test: ["CMD", "curl", "-fsS", "http://localhost:${MARKET_API_PORT:-8080}/actuator/health"]
      start_period: 40s # JVM + Spring startup

  web:
    <<: *common
    build:
      context: ./web
      args:
        ESTIMATOR_API_URL: http://estimator-api:${ESTIMATOR_API_PORT:-8001}
        MARKET_API_URL: http://market-api:${MARKET_API_PORT:-8080}
    image: ghcr.io/ekhrapykin/hpp-web:${TAG:-latest}
    ports: ["${WEB_PORT:-3000}:${WEB_PORT:-3000}"]
    environment:
      PORT: ${WEB_PORT:-3000}
      ESTIMATOR_API_URL: http://estimator-api:${ESTIMATOR_API_PORT:-8001}
      MARKET_API_URL: http://market-api:${MARKET_API_PORT:-8080}
    mem_limit: 384m
    depends_on:
      estimator-api: { condition: service_healthy }
      market-api: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${WEB_PORT:-3000}/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      timeout: 5s # node cold-start + SSR of /

volumes:
  postgres-data:
