[tools]
python = "3.14"
uv = "latest"
java = "temurin-21"
node = "26"

[tasks."dev:ml"]
description = "Run ml-api on :8000"
dir = "ml-api"
run = "uv run uvicorn app.main:app --port 8000"

[tasks."dev:estimator"]
description = "Run estimator-api on :8001"
dir = "estimator-api"
run = "uv run uvicorn app.main:app --port 8001"

[tasks."dev:market"]
description = "Run market-api on :8080"
dir = "market-api"
run = "./gradlew bootRun"

[tasks."dev:web"]
description = "Run the Next.js portal on :3000"
dir = "web"
run = "npm run dev"

[tasks."lint:web"]
description = "Lint, typecheck, contract-check and unit-test the Next.js portal"
dir = "web"
run = "npm run lint && npx tsc --noEmit && npm run check:contracts && npm test"

[tasks.test]
description = "Run pytest in both Python services and gradle test in market-api"
run = [
  "cd ml-api && uv run pytest -q",
  "cd estimator-api && uv run pytest -q",
  "cd market-api && ./gradlew test",
]

[tasks.up]
description = "Build and start everything with docker compose"
run = "docker compose up --build"

[tasks.down]
description = "Stop the docker compose stack"
run = "docker compose down"
